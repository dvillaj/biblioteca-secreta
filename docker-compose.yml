version: '3.8'

services:
  web:
    build: .

    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s
      
    ports:
      - "5991:80"
    environment:
      - WEB_USER=${WEB_USER}
      - WEB_PASSWORD=${WEB_PASSWORD}
    volumes:
      - ${WEB_ZIP}:/tmp/web.zip:ro
      - ${BIB_DIR}:/usr/share/nginx/html/biblioteca:ro